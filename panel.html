<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 설명 도우미</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>AI 설명 도우미</h1><a href="options.html" target="_blank">API 설정</a></header>
<p class="hint">문장을 드래그하거나, 현재 보이는 웹 탭 화면을 분석합니다.</p>
<div class="actions"><button id="selection">선택 문장 가져오기</button><button id="screen">현재 탭 화면 가져오기</button></div>
<div id="preview" class="preview">분석할 내용을 선택하세요.</div>
<label for="question">추가 질문 (선택)</label><textarea id="question" rows="3" placeholder="예: 초보자도 이해할 수 있게 설명해 줘"></textarea>
<button id="analyze" class="primary" disabled>AI에게 설명 요청</button>
<h2>AI 설명</h2><div id="answer" class="answer" aria-live="polite">아직 분석 결과가 없습니다.</div>
<p id="status" class="status"></p>
<script src="panel.js"></script></body></html>
